<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO2 Monitor - Sensor Status</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1900px; margin: 0 auto; }
        
        .nav-menu {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .nav-links { display: flex; gap: 15px; flex-wrap: wrap; }
        
        .nav-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .nav-btn:hover { background: #667eea; color: white; transform: translateY(-2px); }
        .nav-btn.active { background: #667eea; color: white; }
        
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        
        .section-title {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 1.4em;
            font-weight: bold;
            margin: 25px 0 15px 0;
            backdrop-filter: blur(10px);
        }
        
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .sensor-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .sensor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 3px solid #f0f0f0;
        }
        
        .sensor-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }
        
        .sensor-id {
            font-size: 0.8em;
            color: #888;
            font-family: monospace;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
        }
        
        .status-online { background: #10b981; color: white; }
        .status-offline { background: #ef4444; color: white; }
        .status-warning { background: #f59e0b; color: white; }
        
        .health-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .health-good { background: white; }
        .health-bad { background: #fca5a5; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .info-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .info-label {
            font-size: 0.75em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
        }
        
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            flex: 1;
            min-width: 80px;
            padding: 10px;
            background: linear-gradient(135deg, #667eea10 0%, #764ba210 100%);
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.7em;
            color: #666;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #667eea;
        }
        
        .control-section {
            padding-top: 15px;
            border-top: 2px solid #f0f0f0;
        }
        
        .control-title {
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .control-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.3s;
        }
        
        .btn-enable { background: #10b981; color: white; }
        .btn-enable:hover { background: #059669; transform: translateY(-2px); }
        
        .btn-disable { background: #ef4444; color: white; }
        .btn-disable:hover { background: #dc2626; transform: translateY(-2px); }
        
        .log-section {
            margin-top: 12px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .log-title {
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 6px;
            color: #667eea;
        }
        
        .log-entry {
            font-size: 0.75em;
            font-family: monospace;
            padding: 3px 0;
            color: #666;
            border-bottom: 1px solid #eee;
        }
        
        .log-entry:last-child { border-bottom: none; }
        
        /* Color coding for different sensor types */
        .tabung-card .sensor-header { border-bottom-color: #3b82f6; }
        .tabung-card .sensor-name { color: #3b82f6; }
        
        .box-card .sensor-header { border-bottom-color: #f59e0b; }
        .box-card .sensor-name { color: #f59e0b; }
        
        .init-card .sensor-header { border-bottom-color: #8b5cf6; }
        .init-card .sensor-name { color: #8b5cf6; }
        
        /* Init section - single column */
        .init-section {
            max-width: 400px;
        }
        
        @media (max-width: 768px) {
            .sensor-grid {
                grid-template-columns: 1fr;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-menu">
            <div style="font-size: 1.2em; font-weight: bold; color: #667eea;">
                🌱 CO2 Multi-Cluster System
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">📊 Dashboard</a>
                <a href="status.html" class="nav-btn active">🔧 Status Sensors</a>

        <div class="header">
            <h1>🔧 Sensor Status & Control</h1>
            <p>Monitor and control all sensors (6 Tabung, 6 Box, 1 Init)</p>
        </div>
        
        <!-- TABUNG SECTION -->

        <div class="sensor-grid" id="tabungStatusGrid">

        </div>

        <div class="section-title">🎯 Kondisi Awal</div>
        <div class="sensor-grid init-section" id="initStatusGrid">

        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvcKaqEnR7uhX4p6jSumFwW4558jRV_JY",
            authDomain: "co2-iot-727a9.firebaseapp.com",
            databaseURL: "https://co2-iot-727a9-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "co2-iot-727a9",
            storageBucket: "co2-iot-727a9.firebasestorage.app",
            messagingSenderId: "442178296251",
            appId: "1:442178296251:web:057809c7bd085d1aa4cc9e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // Sensor Configuration
        const sensorConfig = {
            tabung1: { p1: "ESP32_T1_P1", p2: "ESP32_T1_P2" },
            tabung2: { p1: "ESP32_T2_P1", p2: "ESP32_T2_P2" },
            tabung3: { p1: "ESP32_T3_P1", p2: "ESP32_T3_P2" },
            tabung4: { p1: "ESP32_T4_P1", p2: "ESP32_T4_P2" },
            tabung5: { p1: "ESP32_T5_P1", p2: "ESP32_T5_P2" },
            tabung6: { p1: "ESP32_T6_P1", p2: "ESP32_T6_P2" },
            box1: "ESP32_B1",
            box2: "ESP32_B2",
            box3: "ESP32_B3",
            box4: "ESP32_B4",
            box5: "ESP32_B5",
            box6: "ESP32_B6",
            init1: "ESP32_INIT"
        };
        
        // Fallback devices
        const fallbackDevices = {
            "ESP32_T1_P1": "ESP32_01",
            "ESP32_T1_P2": "ESP32_02",
            "ESP32_B1": "ESP32_03",
            "ESP32_INIT": "ESP32_04"
        };
        
        const sensorLogs = {};
        
        function getDeviceID(configID) {
            return fallbackDevices[configID] || configID;
        }
        
        function addLog(sensorKey, message) {
            if (!sensorLogs[sensorKey]) sensorLogs[sensorKey] = [];
            
            const now = new Date().toLocaleTimeString('id-ID');
            sensorLogs[sensorKey].unshift(`[${now}] ${message}`);
            
            if (sensorLogs[sensorKey].length > 8) {
                sensorLogs[sensorKey].length = 8;
            }
            
            const logEl = document.getElementById(`log_${sensorKey}`);
            if (logEl) {
                logEl.innerHTML = sensorLogs[sensorKey]
                    .map(log => `<div class="log-entry">${log}</div>`)
                    .join('');
            }
        }
        
        // Generate Tabung status cards
        function generateTabungStatusCards() {
            const grid = document.getElementById('tabungStatusGrid');
            let html = '';
            
            for (let i = 1; i <= 6; i++) {
                html += `
                <div class="sensor-card tabung-card">
                    <div class="sensor-header">
                        <div>
                            <div class="sensor-name">🧪 Tabung ${i}</div>
                            <div class="sensor-id">P1: ${sensorConfig[`tabung${i}`].p1} | P2: ${sensorConfig[`tabung${i}`].p2}</div>
                        </div>
                        <span class="status-badge status-offline" id="status_tabung${i}">
                            <span class="health-dot health-bad"></span>
                            Connecting...
                        </span>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">P1 Value</div>
                            <div class="info-value" id="value_tabung${i}_p1">-- ppm</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">P2 Value</div>
                            <div class="info-value" id="value_tabung${i}_p2">-- ppm</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Last Update</div>
                            <div class="info-value" style="font-size: 0.9em;" id="lastUpdate_tabung${i}">--</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Data Age</div>
                            <div class="info-value" style="font-size: 0.9em;" id="dataAge_tabung${i}">--</div>
                        </div>
                    </div>
                    
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-label">24h Readings</div>
                            <div class="stat-value" id="readings_tabung${i}">--</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Avg PPM</div>
                            <div class="stat-value" id="avgPpm_tabung${i}">--</div>
                        </div>
                    </div>
                    
                    <div class="control-section">
                        <div class="control-title">Remote Control</div>
                        <div class="control-buttons">
                            <button class="btn btn-enable" onclick="controlSensor('tabung${i}', true)">✅ Enable</button>
                            <button class="btn btn-disable" onclick="controlSensor('tabung${i}', false)">❌ Disable</button>
                        </div>
                    </div>
                    
                    <div class="log-section">
                        <div class="log-title">Activity Log</div>
                        <div id="log_tabung${i}">
                            <div class="log-entry">Waiting for data...</div>
                        </div>
                    </div>
                </div>`;
            }
            
            grid.innerHTML = html;
        }
        
        // Generate Box status cards
        function generateBoxStatusCards() {
            const grid = document.getElementById('boxStatusGrid');
            let html = '';
            
            for (let i = 1; i <= 6; i++) {
                html += `
                <div class="sensor-card box-card">
                    <div class="sensor-header">
                        <div>
                            <div class="sensor-name">📦 Box ${i}</div>
                            <div class="sensor-id">${sensorConfig[`box${i}`]}</div>
                        </div>
                        <span class="status-badge status-offline" id="status_box${i}">
                            <span class="health-dot health-bad"></span>
                            Connecting...
                        </span>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Current Value</div>
                            <div class="info-value" id="value_box${i}">-- ppm</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Last Update</div>
                            <div class="info-value" style="font-size: 0.9em;" id="lastUpdate_box${i}">--</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Data Age</div>
                            <div class="info-value" style="font-size: 0.9em;" id="dataAge_box${i}">--</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Device Status</div>
                            <div class="info-value" style="font-size: 0.9em;" id="deviceStatus_box${i}">--</div>
                        </div>
                    </div>
                    
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-label">24h Readings</div>
                            <div class="stat-value" id="readings_box${i}">--</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Avg PPM</div>
                            <div class="stat-value" id="avgPpm_box${i}">--</div>
                        </div>
                    </div>
                    
                    <div class="control-section">
                        <div class="control-title">Remote Control</div>
                        <div class="control-buttons">
                            <button class="btn btn-enable" onclick="controlSensor('box${i}', true)">✅ Enable</button>
                            <button class="btn btn-disable" onclick="controlSensor('box${i}', false)">❌ Disable</button>
                        </div>
                    </div>
                    
                    <div class="log-section">
                        <div class="log-title">Activity Log</div>
                        <div id="log_box${i}">
                            <div class="log-entry">Waiting for data...</div>
                        </div>
                    </div>
                </div>`;
            }
            
            grid.innerHTML = html;
        }
        
        // Generate Init status card
        function generateInitStatusCard() {
            const grid = document.getElementById('initStatusGrid');
            grid.innerHTML = `
                <div class="sensor-card init-card">
                    <div class="sensor-header">
                        <div>
                            <div class="sensor-name">🎯 Kondisi Awal</div>
                            <div class="sensor-id">${sensorConfig.init1}</div>
                        </div>
                        <span class="status-badge status-offline" id="status_init1">
                            <span class="health-dot health-bad"></span>
                            Connecting...
                        </span>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Current Value</div>
                            <div class="info-value" id="value_init1">-- ppm</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Last Update</div>
                            <div class="info-value" style="font-size: 0.9em;" id="lastUpdate_init1">--</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Data Age</div>
                            <div class="info-value" style="font-size: 0.9em;" id="dataAge_init1">--</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Device Status</div>
                            <div class="info-value" style="font-size: 0.9em;" id="deviceStatus_init1">--</div>
                        </div>
                    </div>
                    
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-label">24h Readings</div>
                            <div class="stat-value" id="readings_init1">--</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Avg PPM</div>
                            <div class="stat-value" id="avgPpm_init1">--</div>
                        </div>
                    </div>
                    
                    <div class="control-section">
                        <div class="control-title">Remote Control</div>
                        <div class="control-buttons">
                            <button class="btn btn-enable" onclick="controlSensor('init1', true)">✅ Enable</button>
                            <button class="btn btn-disable" onclick="controlSensor('init1', false)">❌ Disable</button>
                        </div>
                    </div>
                    
                    <div class="log-section">
                        <div class="log-title">Activity Log</div>
                        <div id="log_init1">
                            <div class="log-entry">Waiting for data...</div>
                        </div>
                    </div>
                </div>`;
        }
        
        // Setup Tabung sensor monitoring
        function setupTabungSensor(tabungNum) {
            const p1ID = getDeviceID(sensorConfig[`tabung${tabungNum}`].p1);
            const p2ID = getDeviceID(sensorConfig[`tabung${tabungNum}`].p2);
            const sensorKey = `tabung${tabungNum}`;
            
            // Listen P1
            database.ref(`sensors/${p1ID}/latest`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const ppm = Math.round(data.co2 || data.value || 0);
                    const age = Math.round((Date.now() - data.timestamp) / 1000);
                    const date = new Date(data.timestamp);
                    
                    document.getElementById(`value_${sensorKey}_p1`).textContent = `${ppm} ppm`;
                    document.getElementById(`lastUpdate_${sensorKey}`).textContent = date.toLocaleTimeString('id-ID');
                    document.getElementById(`dataAge_${sensorKey}`).textContent = age < 60 ? `${age}s ago` : `${Math.floor(age/60)}m ago`;
                    
                    updateSensorStatus(sensorKey, age);
                    addLog(sensorKey, `P1 data: ${ppm} ppm`);
                }
            });
            
            // Listen P2
            database.ref(`sensors/${p2ID}/latest`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const ppm = Math.round(data.co2 || data.value || 0);
                    document.getElementById(`value_${sensorKey}_p2`).textContent = `${ppm} ppm`;
                    addLog(sensorKey, `P2 data: ${ppm} ppm`);
                }
            });
            
            // Load 24h stats
            load24hStats(sensorKey, p1ID);
        }
        
        // Setup Box sensor monitoring
        function setupBoxSensor(boxNum) {
            const deviceID = getDeviceID(sensorConfig[`box${boxNum}`]);
            const sensorKey = `box${boxNum}`;
            
            database.ref(`sensors/${deviceID}/latest`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const ppm = Math.round(data.co2 || data.value || 0);
                    const age = Math.round((Date.now() - data.timestamp) / 1000);
                    const date = new Date(data.timestamp);
                    
                    document.getElementById(`value_${sensorKey}`).textContent = `${ppm} ppm`;
                    document.getElementById(`lastUpdate_${sensorKey}`).textContent = date.toLocaleTimeString('id-ID');
                    document.getElementById(`dataAge_${sensorKey}`).textContent = age < 60 ? `${age}s ago` : `${Math.floor(age/60)}m ago`;
                    
                    updateSensorStatus(sensorKey, age);
                    addLog(sensorKey, `Data: ${ppm} ppm`);
                }
            });
            
            // Control status
            database.ref(`control/${deviceID}/enabled`).on('value', (snapshot) => {
                const enabled = snapshot.val();
                document.getElementById(`deviceStatus_${sensorKey}`).textContent = enabled ? '✅ Enabled' : '❌ Disabled';
                if (enabled !== null) {
                    addLog(sensorKey, `Device ${enabled ? 'enabled' : 'disabled'}`);
                }
            });
            
            load24hStats(sensorKey, deviceID);
        }
        
        // Setup Init sensor
        function setupInitSensor() {
            const deviceID = getDeviceID(sensorConfig.init1);
            const sensorKey = 'init1';
            
            database.ref(`sensors/${deviceID}/latest`).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const ppm = Math.round(data.co2 || data.value || 0);
                    const age = Math.round((Date.now() - data.timestamp) / 1000);
                    const date = new Date(data.timestamp);
                    
                    document.getElementById(`value_${sensorKey}`).textContent = `${ppm} ppm`;
                    document.getElementById(`lastUpdate_${sensorKey}`).textContent = date.toLocaleTimeString('id-ID');
                    document.getElementById(`dataAge_${sensorKey}`).textContent = age < 60 ? `${age}s ago` : `${Math.floor(age/60)}m ago`;
                    
                    updateSensorStatus(sensorKey, age);
                    addLog(sensorKey, `Data: ${ppm} ppm`);
                }
            });
            
            database.ref(`control/${deviceID}/enabled`).on('value', (snapshot) => {
                const enabled = snapshot.val();
                document.getElementById(`deviceStatus_${sensorKey}`).textContent = enabled ? '✅ Enabled' : '❌ Disabled';
                if (enabled !== null) {
                    addLog(sensorKey, `Device ${enabled ? 'enabled' : 'disabled'}`);
                }
            });
            
            load24hStats(sensorKey, deviceID);
        }
        
        function updateSensorStatus(sensorKey, age) {
            const statusEl = document.getElementById(`status_${sensorKey}`);
            const healthDot = statusEl.querySelector('.health-dot');
            
            if (age < 120) {
                statusEl.innerHTML = '<span class="health-dot health-good"></span> Online';
                statusEl.className = 'status-badge status-online';
            } else if (age < 300) {
                statusEl.innerHTML = '<span class="health-dot health-bad"></span> Delayed';
                statusEl.className = 'status-badge status-warning';
            } else {
                statusEl.innerHTML = '<span class="health-dot health-bad"></span> Offline';
                statusEl.className = 'status-badge status-offline';
            }
        }
        
        function load24hStats(sensorKey, deviceID) {
            const cutoff = Date.now() - (24 * 60 * 60 * 1000);
            
            database.ref(`sensors/${deviceID}/history`)
                .limitToLast(1500)
                .once('value')
                .then((snapshot) => {
                    let count = 0;
                    let sum = 0;
                    
                    snapshot.forEach((child) => {
                        const data = child.val();
                        const co2 = data.co2 || data.value;
                        
                        if (data && co2 && data.timestamp >= cutoff) {
                            count++;
                            sum += co2;
                        }
                    });
                    
                    document.getElementById(`readings_${sensorKey}`).textContent = count;
                    document.getElementById(`avgPpm_${sensorKey}`).textContent = count > 0 ? Math.round(sum / count) : '--';
                    
                    addLog(sensorKey, `24h stats: ${count} readings`);
                });
        }
        
        function controlSensor(sensorKey, enable) {
            let deviceID;
            
            if (sensorKey.startsWith('tabung')) {
                // For tabung, control P1 device
                deviceID = getDeviceID(sensorConfig[sensorKey].p1);
            } else if (sensorKey.startsWith('box')) {
                deviceID = getDeviceID(sensorConfig[sensorKey]);
            } else {
                deviceID = getDeviceID(sensorConfig.init1);
            }
            
            database.ref(`control/${deviceID}/enabled`).set(enable)
                .then(() => {
                    addLog(sensorKey, `Control: ${enable ? 'ENABLE' : 'DISABLE'}`);
                    alert(`${sensorKey} ${enable ? 'enabled' : 'disabled'} successfully!`);
                })
                .catch((error) => {
                    addLog(sensorKey, `Control failed: ${error.message}`);
                    alert(`Failed: ${error.message}`);
                });
        }
        
        // Initialize
        function init() {
            generateTabungStatusCards();
            generateBoxStatusCards();
            generateInitStatusCard();
            
            for (let i = 1; i <= 6; i++) {
                setupTabungSensor(i);
                setupBoxSensor(i);
            }
            setupInitSensor();
        }
        
        // Auto-refresh stats
        setInterval(() => {
            for (let i = 1; i <= 6; i++) {
                const p1ID = getDeviceID(sensorConfig[`tabung${i}`].p1);
                load24hStats(`tabung${i}`, p1ID);
                
                const boxID = getDeviceID(sensorConfig[`box${i}`]);
                load24hStats(`box${i}`, boxID);
            }
            load24hStats('init1', getDeviceID(sensorConfig.init1));
        }, 5 * 60 * 1000);
        
        init();
    </script>
</body>
</html>
