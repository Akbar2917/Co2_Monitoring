<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO2 Monitor - Multi Cluster Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1900px; margin: 0 auto; }
        
        .nav-menu {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .nav-links { display: flex; gap: 15px; flex-wrap: wrap; }
        
        .nav-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .nav-btn:hover { background: #667eea; color: white; transform: translateY(-2px); }
        .nav-btn.active { background: #667eea; color: white; }
        
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        
        .status-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8em;
        }
        
        .status-online { background: #10b981; color: white; }
        .status-offline { background: #ef4444; color: white; }
        
        .section-title {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 1.5em;
            font-weight: bold;
            margin: 30px 0 20px 0;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .cluster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .cluster-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .cluster-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #f0f0f0;
        }
        
        .cluster-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }
        
        .cluster-status {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .sensor-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .sensor-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        
        .sensor-label {
            font-size: 0.75em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .sensor-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }
        
        .sensor-unit {
            font-size: 0.8em;
            color: #888;
        }
        
        .avg-highlight {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border: 2px solid #667eea;
        }
        
        .avg-highlight .sensor-value {
            color: #667eea;
        }
        
        .sensor-status {
            margin-top: 8px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7em;
            font-weight: bold;
        }
        
        .status-good { background: #d1fae5; color: #065f46; }
        .status-warning { background: #fef3c7; color: #92400e; }
        .status-danger { background: #fee2e2; color: #991b1b; }
        
        .chart-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .chart-title { font-size: 1.3em; font-weight: bold; color: #333; }
        
        .chart-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .chart-btn {
            padding: 6px 14px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.3s;
        }
        
        .chart-btn:hover { background: #667eea; color: white; }
        .chart-btn.active { background: #667eea; color: white; }
        
        .chart-container { position: relative; height: 350px; width: 100%; }
        
        .chart-info {
            text-align: center;
            color: #888;
            font-size: 0.85em;
            margin-top: 10px;
        }
        
        .init-section {
            max-width: 400px;
        }
        
        /* Color indicators for different tabung */
        .tabung-1 .cluster-name { color: #3b82f6; }
        .tabung-1 .cluster-header { border-bottom-color: #3b82f6; }
        
        .tabung-2 .cluster-name { color: #10b981; }
        .tabung-2 .cluster-header { border-bottom-color: #10b981; }
        
        .tabung-3 .cluster-name { color: #f59e0b; }
        .tabung-3 .cluster-header { border-bottom-color: #f59e0b; }
        
        .tabung-4 .cluster-name { color: #ef4444; }
        .tabung-4 .cluster-header { border-bottom-color: #ef4444; }
        
        .tabung-5 .cluster-name { color: #8b5cf6; }
        .tabung-5 .cluster-header { border-bottom-color: #8b5cf6; }
        
        .tabung-6 .cluster-name { color: #ec4899; }
        .tabung-6 .cluster-header { border-bottom-color: #ec4899; }
        
        .box-1 .cluster-name { color: #06b6d4; }
        .box-1 .cluster-header { border-bottom-color: #06b6d4; }
        
        .box-2 .cluster-name { color: #84cc16; }
        .box-2 .cluster-header { border-bottom-color: #84cc16; }
        
        .box-3 .cluster-name { color: #f97316; }
        .box-3 .cluster-header { border-bottom-color: #f97316; }
        
        .box-4 .cluster-name { color: #dc2626; }
        .box-4 .cluster-header { border-bottom-color: #dc2626; }
        
        .box-5 .cluster-name { color: #7c3aed; }
        .box-5 .cluster-header { border-bottom-color: #7c3aed; }
        
        .box-6 .cluster-name { color: #db2777; }
        .box-6 .cluster-header { border-bottom-color: #db2777; }
        
        .init-card .cluster-name { color: #6366f1; }
        .init-card .cluster-header { border-bottom-color: #6366f1; }
        
        @media (max-width: 768px) {
            .cluster-grid {
                grid-template-columns: 1fr;
            }
            .sensor-row {
                grid-template-columns: 1fr;
            }
            .sensor-value {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-menu">
            <div style="font-size: 1.2em; font-weight: bold; color: #667eea;">
                🌱 CO2 Multi-Cluster System
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn active">📊 Dashboard</a>
                <a href="status.html" class="nav-btn">🔧 Status Sensors</a>
                <a href="history.html" class="nav-btn">📅 Historical</a>
            </div>
        </div>
        
        <div class="header">
            <h1>🌱 CO2 Monitoring Dashboard</h1>
            <p>Real-time Multi-Cluster Monitoring System (6 Tabung, 6 Box, 1 Init)</p>
            <div class="status-badges" id="statusBadges">
                <!-- Status badges will be generated dynamically -->
            </div>
        </div>
        
        <!-- TABUNG SECTION -->
        <div class="section-title">
            🧪 Tabung Sensors (1-6)
        </div>
        
        <div class="cluster-grid" id="tabungGrid">
            <!-- Tabung 1-6 cards will be generated dynamically -->
        </div>
        
        <!-- BOX SECTION -->
        <div class="section-title">
            📦 Box Sensors (1-6)
        </div>
        
        <div class="cluster-grid" id="boxGrid">
            <!-- Box 1-6 cards will be generated dynamically -->
        </div>
        
        <!-- INIT SECTION -->
        <div class="section-title">
            🎯 Kondisi Awal
        </div>
        
        <div class="cluster-grid init-section" id="initGrid">
            <!-- Init 1 card will be generated dynamically -->
        </div>
        
        <!-- COMBINED CHART -->
        <div class="section-title">
            📈 Live Charts
        </div>
        
        <div class="chart-section">
            <div class="chart-header">
                <div class="chart-title">📊 CO2 Trend Comparison</div>
                <div class="chart-selector">
                    <select id="chartSensorSelect" class="chart-btn" onchange="updateChartSensor()">
                        <optgroup label="Tabung">
                            <option value="tabung1">Tabung 1</option>
                            <option value="tabung2" selected>Tabung 2</option>
                            <option value="tabung3">Tabung 3</option>
                            <option value="tabung4">Tabung 4</option>
                            <option value="tabung5">Tabung 5</option>
                            <option value="tabung6">Tabung 6</option>
                        </optgroup>
                        <optgroup label="Box">
                            <option value="box1">Box 1</option>
                            <option value="box2">Box 2</option>
                            <option value="box3">Box 3</option>
                            <option value="box4">Box 4</option>
                            <option value="box5">Box 5</option>
                            <option value="box6">Box 6</option>
                        </optgroup>
                        <optgroup label="Init">
                            <option value="init1">Init 1</option>
                        </optgroup>
                    </select>
                    <button class="chart-btn" onclick="changeTimeRange(1)">1h</button>
                    <button class="chart-btn" onclick="changeTimeRange(3)">3h</button>
                    <button class="chart-btn active" onclick="changeTimeRange(6)" id="btn6h">6h</button>
                    <button class="chart-btn" onclick="changeTimeRange(12)">12h</button>
                    <button class="chart-btn" onclick="changeTimeRange(24)">24h</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
            <div class="chart-info" id="chartInfo">Loading...</div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDvcKaqEnR7uhX4p6jSumFwW4558jRV_JY",
            authDomain: "co2-iot-727a9.firebaseapp.com",
            databaseURL: "https://co2-iot-727a9-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "co2-iot-727a9",
            storageBucket: "co2-iot-727a9.firebasestorage.app",
            messagingSenderId: "442178296251",
            appId: "1:442178296251:web:057809c7bd085d1aa4cc9e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ========================================
        // SENSOR CONFIGURATION - SESUAI ARDUINO
        // ========================================
        // Arduino path: tabung2/P1/latest, tabung2/P2/latest
        // Arduino path: tabung2/P1/history, tabung2/P2/history
        // ========================================
        
        const sensorConfig = {
            // Tabung 1-6 - SESUAI FORMAT ARDUINO: tabungX/P1 dan tabungX/P2
            tabung1: {
                tabungName: "tabung1",  // Path di Firebase
                p1: { color: "#3b82f6" },
                p2: { color: "#60a5fa" }
            },
            tabung2: {
                tabungName: "tabung2",  // Path di Firebase - INI YANG AKTIF
                p1: { color: "#10b981" },
                p2: { color: "#34d399" }
            },
            tabung3: {
                tabungName: "tabung3",
                p1: { color: "#f59e0b" },
                p2: { color: "#fbbf24" }
            },
            tabung4: {
                tabungName: "tabung4",
                p1: { color: "#ef4444" },
                p2: { color: "#f87171" }
            },
            tabung5: {
                tabungName: "tabung5",
                p1: { color: "#8b5cf6" },
                p2: { color: "#a78bfa" }
            },
            tabung6: {
                tabungName: "tabung6",
                p1: { color: "#ec4899" },
                p2: { color: "#f472b6" }
            },
            // Box 1-6 - format: boxX/latest
            box1: { basePath: "box1", color: "#06b6d4" },
            box2: { basePath: "box2", color: "#84cc16" },
            box3: { basePath: "box3", color: "#f97316" },
            box4: { basePath: "box4", color: "#dc2626" },
            box5: { basePath: "box5", color: "#7c3aed" },
            box6: { basePath: "box6", color: "#db2777" },
            // Init - format: init1/latest
            init1: { basePath: "init1", color: "#6366f1" }
        };
        
        // State management
        let sensorData = {};
        let currentTimeRange = 6;
        let currentChartSensor = 'tabung2';  // Default ke tabung2 karena itu yang aktif
        let mainChart = null;
        let tabungValues = {};  // Store P1/P2 values per tabung
        
        // Generate HTML for Tabung cards
        function generateTabungCards() {
            const grid = document.getElementById('tabungGrid');
            let html = '';
            
            for (let i = 1; i <= 6; i++) {
                html += `
                <div class="cluster-card tabung-${i}">
                    <div class="cluster-header">
                        <div class="cluster-name">🧪 Tabung ${i}</div>
                        <span class="cluster-status status-offline" id="statusTabung${i}">Offline</span>
                    </div>
                    <div class="sensor-row">
                        <div class="sensor-item">
                            <div class="sensor-label">P1</div>
                            <div class="sensor-value" id="tabung${i}P1Value">--</div>
                            <div class="sensor-unit">ppm</div>
                        </div>
                        <div class="sensor-item">
                            <div class="sensor-label">P2</div>
                            <div class="sensor-value" id="tabung${i}P2Value">--</div>
                            <div class="sensor-unit">ppm</div>
                        </div>
                        <div class="sensor-item avg-highlight">
                            <div class="sensor-label">AVG</div>
                            <div class="sensor-value" id="tabung${i}AvgValue">--</div>
                            <div class="sensor-unit">ppm</div>
                        </div>
                    </div>
                    <div class="sensor-status status-good" id="tabung${i}Status">Loading...</div>
                </div>`;
                
                // Initialize values storage
                tabungValues[`tabung${i}`] = { p1: null, p2: null };
            }
            
            grid.innerHTML = html;
        }
        
        // Generate HTML for Box cards
        function generateBoxCards() {
            const grid = document.getElementById('boxGrid');
            let html = '';
            
            for (let i = 1; i <= 6; i++) {
                html += `
                <div class="cluster-card box-${i}">
                    <div class="cluster-header">
                        <div class="cluster-name">📦 Box ${i}</div>
                        <span class="cluster-status status-offline" id="statusBox${i}">Offline</span>
                    </div>
                    <div class="sensor-row">
                        <div class="sensor-item" style="grid-column: span 3;">
                            <div class="sensor-label">CO2 Level</div>
                            <div class="sensor-value" id="box${i}Value">--</div>
                            <div class="sensor-unit">ppm</div>
                        </div>
                    </div>
                    <div class="sensor-status status-good" id="box${i}Status">Loading...</div>
                </div>`;
            }
            
            grid.innerHTML = html;
        }
        
        // Generate Init card
        function generateInitCards() {
            const grid = document.getElementById('initGrid');
            grid.innerHTML = `
                <div class="cluster-card init-card">
                    <div class="cluster-header">
                        <div class="cluster-name">🎯 Kondisi Awal</div>
                        <span class="cluster-status status-offline" id="statusInit1">Offline</span>
                    </div>
                    <div class="sensor-row">
                        <div class="sensor-item" style="grid-column: span 3;">
                            <div class="sensor-label">CO2 Level</div>
                            <div class="sensor-value" id="init1Value">--</div>
                            <div class="sensor-unit">ppm</div>
                        </div>
                    </div>
                    <div class="sensor-status status-good" id="init1Status">Loading...</div>
                </div>`;
        }
        
        // Generate status badges
        function generateStatusBadges() {
            const container = document.getElementById('statusBadges');
            let html = '';
            
            for (let i = 1; i <= 6; i++) {
                html += `<span class="status-badge status-offline" id="badgeT${i}">T${i}: Offline</span>`;
            }
            for (let i = 1; i <= 6; i++) {
                html += `<span class="status-badge status-offline" id="badgeB${i}">B${i}: Offline</span>`;
            }
            html += `<span class="status-badge status-offline" id="badgeInit">Init: Offline</span>`;
            
            container.innerHTML = html;
        }
        
        // Helper function to get CO2 status
        function updateStatusIndicator(ppm) {
            if (ppm < 800) return { text: '✅ Excellent', class: 'status-good' };
            if (ppm < 1000) return { text: '👍 Good', class: 'status-good' };
            if (ppm < 1500) return { text: '⚠️ Moderate', class: 'status-warning' };
            if (ppm < 2000) return { text: '⚠️ Poor', class: 'status-warning' };
            return { text: '🚨 Danger', class: 'status-danger' };
        }
        
        // ========================================
        // SETUP TABUNG SENSORS - FIXED PATH
        // Path: tabungX/P1/latest dan tabungX/P2/latest
        // ========================================
        function setupTabungSensor(tabungNum) {
            const config = sensorConfig[`tabung${tabungNum}`];
            const tabungName = config.tabungName;  // e.g., "tabung2"
            
            // Path untuk P1: tabung2/P1/latest
            const p1Path = `${tabungName}/P1/latest`;
            // Path untuk P2: tabung2/P2/latest
            const p2Path = `${tabungName}/P2/latest`;
            
            console.log(`Setting up Tabung ${tabungNum}:`);
            console.log(`  P1 path: ${p1Path}`);
            console.log(`  P2 path: ${p2Path}`);
            
            // Listen to P1
            database.ref(p1Path).on('value', (snapshot) => {
                const data = snapshot.val();
                console.log(`Tabung ${tabungNum} P1 data:`, data);
                
                if (data) {
                    const ppm = Math.round(data.co2 || data.value || 0);
                    const timestamp = data.timestamp || data.ts || Date.now();
                    const age = Math.round((Date.now() - timestamp) / 1000);
                    
                    document.getElementById(`tabung${tabungNum}P1Value`).textContent = ppm;
                    tabungValues[`tabung${tabungNum}`].p1 = ppm;
                    
                    updateTabungAvg(tabungNum);
                    updateTabungStatus(tabungNum, age);
                }
            });
            
            // Listen to P2
            database.ref(p2Path).on('value', (snapshot) => {
                const data = snapshot.val();
                console.log(`Tabung ${tabungNum} P2 data:`, data);
                
                if (data) {
                    const ppm = Math.round(data.co2 || data.value || 0);
                    
                    document.getElementById(`tabung${tabungNum}P2Value`).textContent = ppm;
                    tabungValues[`tabung${tabungNum}`].p2 = ppm;
                    
                    updateTabungAvg(tabungNum);
                }
            });
            
            // Initialize storage for history
            if (!sensorData[`tabung${tabungNum}`]) {
                sensorData[`tabung${tabungNum}`] = { p1: [], p2: [] };
            }
            
            // Load history data
            loadTabungHistory(tabungNum, 'P1');
            loadTabungHistory(tabungNum, 'P2');
        }
        
        function updateTabungAvg(tabungNum) {
            const values = tabungValues[`tabung${tabungNum}`];
            const p1 = values.p1;
            const p2 = values.p2;
            
            if (p1 !== null && p2 !== null) {
                const avg = Math.round((p1 + p2) / 2);
                document.getElementById(`tabung${tabungNum}AvgValue`).textContent = avg;
                
                const status = updateStatusIndicator(avg);
                const statusEl = document.getElementById(`tabung${tabungNum}Status`);
                statusEl.textContent = status.text;
                statusEl.className = `sensor-status ${status.class}`;
            } else if (p1 !== null) {
                document.getElementById(`tabung${tabungNum}AvgValue`).textContent = p1;
                const status = updateStatusIndicator(p1);
                const statusEl = document.getElementById(`tabung${tabungNum}Status`);
                statusEl.textContent = status.text;
                statusEl.className = `sensor-status ${status.class}`;
            } else if (p2 !== null) {
                document.getElementById(`tabung${tabungNum}AvgValue`).textContent = p2;
                const status = updateStatusIndicator(p2);
                const statusEl = document.getElementById(`tabung${tabungNum}Status`);
                statusEl.textContent = status.text;
                statusEl.className = `sensor-status ${status.class}`;
            }
        }
        
        function updateTabungStatus(tabungNum, age) {
            const statusEl = document.getElementById(`statusTabung${tabungNum}`);
            const badgeEl = document.getElementById(`badgeT${tabungNum}`);
            
            if (age < 120) {  // Online if data < 2 minutes old
                statusEl.textContent = 'Online';
                statusEl.className = 'cluster-status status-online';
                if (badgeEl) {
                    badgeEl.textContent = `T${tabungNum}: Online`;
                    badgeEl.className = 'status-badge status-online';
                }
            } else {
                statusEl.textContent = 'Offline';
                statusEl.className = 'cluster-status status-offline';
                if (badgeEl) {
                    badgeEl.textContent = `T${tabungNum}: Offline`;
                    badgeEl.className = 'status-badge status-offline';
                }
            }
        }
        
        // Load Tabung History - Fixed path: tabungX/P1/history
        function loadTabungHistory(tabungNum, point) {
            const config = sensorConfig[`tabung${tabungNum}`];
            const tabungName = config.tabungName;
            const historyPath = `${tabungName}/${point}/history`;
            
            const cutoff = Date.now() - (24 * 60 * 60 * 1000);
            
            console.log(`Loading history from: ${historyPath}`);
            
            database.ref(historyPath)
                .limitToLast(1500)
                .once('value')
                .then((snapshot) => {
                    const data = [];
                    
                    snapshot.forEach((child) => {
                        const d = child.val();
                        const co2 = d.co2 || d.value;
                        const timestamp = d.ts || d.timestamp;
                        
                        if (d && co2 && timestamp >= cutoff && co2 >= 200 && co2 <= 5000) {
                            data.push({ timestamp: timestamp, value: co2 });
                        }
                    });
                    
                    data.sort((a, b) => a.timestamp - b.timestamp);
                    
                    // Store with lowercase key for consistency
                    const pointKey = point.toLowerCase();
                    sensorData[`tabung${tabungNum}`][pointKey] = data;
                    
                    console.log(`Loaded ${data.length} history points for Tabung ${tabungNum} ${point}`);
                    
                    if (currentChartSensor === `tabung${tabungNum}`) {
                        updateMainChart();
                    }
                })
                .catch(err => console.error(`Error loading history for ${historyPath}:`, err));
        }
        
        // Setup Box sensors - Path: boxX/latest
        function setupBoxSensor(boxNum) {
            const config = sensorConfig[`box${boxNum}`];
            const basePath = config.basePath;
            const latestPath = `${basePath}/latest`;
            
            console.log(`Setting up Box ${boxNum} at path: ${latestPath}`);
            
            database.ref(latestPath).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const ppm = Math.round(data.co2 || data.value || 0);
                    const timestamp = data.timestamp || data.ts || Date.now();
                    const age = Math.round((Date.now() - timestamp) / 1000);
                    
                    document.getElementById(`box${boxNum}Value`).textContent = ppm;
                    
                    const status = updateStatusIndicator(ppm);
                    const statusEl = document.getElementById(`box${boxNum}Status`);
                    statusEl.textContent = status.text;
                    statusEl.className = `sensor-status ${status.class}`;
                    
                    const clusterStatus = document.getElementById(`statusBox${boxNum}`);
                    const badgeEl = document.getElementById(`badgeB${boxNum}`);
                    
                    if (age < 120) {
                        clusterStatus.textContent = 'Online';
                        clusterStatus.className = 'cluster-status status-online';
                        if (badgeEl) {
                            badgeEl.textContent = `B${boxNum}: Online`;
                            badgeEl.className = 'status-badge status-online';
                        }
                    } else {
                        clusterStatus.textContent = 'Offline';
                        clusterStatus.className = 'cluster-status status-offline';
                        if (badgeEl) {
                            badgeEl.textContent = `B${boxNum}: Offline`;
                            badgeEl.className = 'status-badge status-offline';
                        }
                    }
                }
            });
            
            // Initialize storage
            if (!sensorData[`box${boxNum}`]) {
                sensorData[`box${boxNum}`] = [];
            }
            
            loadBoxHistory(boxNum);
        }
        
        // Load Box History
        function loadBoxHistory(boxNum) {
            const config = sensorConfig[`box${boxNum}`];
            const historyPath = `${config.basePath}/history`;
            const cutoff = Date.now() - (24 * 60 * 60 * 1000);
            
            database.ref(historyPath)
                .limitToLast(1500)
                .once('value')
                .then((snapshot) => {
                    const data = [];
                    
                    snapshot.forEach((child) => {
                        const d = child.val();
                        const co2 = d.co2 || d.value;
                        const timestamp = d.ts || d.timestamp;
                        
                        if (d && co2 && timestamp >= cutoff && co2 >= 200 && co2 <= 5000) {
                            data.push({ timestamp: timestamp, value: co2 });
                        }
                    });
                    
                    data.sort((a, b) => a.timestamp - b.timestamp);
                    sensorData[`box${boxNum}`] = data;
                    
                    if (currentChartSensor === `box${boxNum}`) {
                        updateMainChart();
                    }
                });
        }
        
        // Setup Init sensor
        function setupInitSensor() {
            const config = sensorConfig.init1;
            const latestPath = `${config.basePath}/latest`;
            
            console.log(`Setting up Init at path: ${latestPath}`);
            
            database.ref(latestPath).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const ppm = Math.round(data.co2 || data.value || 0);
                    const timestamp = data.timestamp || data.ts || Date.now();
                    const age = Math.round((Date.now() - timestamp) / 1000);
                    
                    document.getElementById('init1Value').textContent = ppm;
                    
                    const status = updateStatusIndicator(ppm);
                    const statusEl = document.getElementById('init1Status');
                    statusEl.textContent = status.text;
                    statusEl.className = `sensor-status ${status.class}`;
                    
                    const clusterStatus = document.getElementById('statusInit1');
                    const badgeEl = document.getElementById('badgeInit');
                    
                    if (age < 120) {
                        clusterStatus.textContent = 'Online';
                        clusterStatus.className = 'cluster-status status-online';
                        if (badgeEl) {
                            badgeEl.textContent = 'Init: Online';
                            badgeEl.className = 'status-badge status-online';
                        }
                    } else {
                        clusterStatus.textContent = 'Offline';
                        clusterStatus.className = 'cluster-status status-offline';
                        if (badgeEl) {
                            badgeEl.textContent = 'Init: Offline';
                            badgeEl.className = 'status-badge status-offline';
                        }
                    }
                }
            });
            
            // Initialize storage
            if (!sensorData.init1) {
                sensorData.init1 = [];
            }
            
            loadInitHistory();
        }
        
        // Load Init History
        function loadInitHistory() {
            const config = sensorConfig.init1;
            const historyPath = `${config.basePath}/history`;
            const cutoff = Date.now() - (24 * 60 * 60 * 1000);
            
            database.ref(historyPath)
                .limitToLast(1500)
                .once('value')
                .then((snapshot) => {
                    const data = [];
                    
                    snapshot.forEach((child) => {
                        const d = child.val();
                        const co2 = d.co2 || d.value;
                        const timestamp = d.ts || d.timestamp;
                        
                        if (d && co2 && timestamp >= cutoff && co2 >= 200 && co2 <= 5000) {
                            data.push({ timestamp: timestamp, value: co2 });
                        }
                    });
                    
                    data.sort((a, b) => a.timestamp - b.timestamp);
                    sensorData.init1 = data;
                    
                    if (currentChartSensor === 'init1') {
                        updateMainChart();
                    }
                });
        }
        
        // Chart functions
        function initMainChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: []
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: { display: true, text: 'CO2 (ppm)' }
                        },
                        x: {
                            title: { display: true, text: 'Time' },
                            ticks: { maxTicksLimit: 12 }
                        }
                    }
                }
            });
        }
        
        function updateMainChart() {
            if (!mainChart) return;
            
            const cutoff = Date.now() - (currentTimeRange * 60 * 60 * 1000);
            let datasets = [];
            let allLabels = new Set();
            
            if (currentChartSensor.startsWith('tabung')) {
                const data = sensorData[currentChartSensor];
                if (!data) return;
                
                const tabungNum = currentChartSensor.replace('tabung', '');
                const config = sensorConfig[currentChartSensor];
                
                // P1 data
                if (data.p1 && data.p1.length > 0) {
                    let filtered = data.p1.filter(d => d.timestamp >= cutoff);
                    if (filtered.length > 100) {
                        const step = Math.ceil(filtered.length / 100);
                        filtered = filtered.filter((_, i) => i % step === 0);
                    }
                    
                    filtered.forEach(d => allLabels.add(d.timestamp));
                    
                    datasets.push({
                        label: `Tabung ${tabungNum} - P1`,
                        data: filtered.map(d => ({ x: d.timestamp, y: Math.round(d.value) })),
                        borderColor: config.p1.color,
                        backgroundColor: config.p1.color + '20',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.4,
                        pointRadius: 2
                    });
                }
                
                // P2 data
                if (data.p2 && data.p2.length > 0) {
                    let filtered = data.p2.filter(d => d.timestamp >= cutoff);
                    if (filtered.length > 100) {
                        const step = Math.ceil(filtered.length / 100);
                        filtered = filtered.filter((_, i) => i % step === 0);
                    }
                    
                    filtered.forEach(d => allLabels.add(d.timestamp));
                    
                    datasets.push({
                        label: `Tabung ${tabungNum} - P2`,
                        data: filtered.map(d => ({ x: d.timestamp, y: Math.round(d.value) })),
                        borderColor: config.p2.color,
                        backgroundColor: config.p2.color + '20',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.4,
                        pointRadius: 2
                    });
                }
            } else {
                // Box or Init
                const data = sensorData[currentChartSensor];
                if (!data || data.length === 0) return;
                
                let filtered = data.filter(d => d.timestamp >= cutoff);
                if (filtered.length > 100) {
                    const step = Math.ceil(filtered.length / 100);
                    filtered = filtered.filter((_, i) => i % step === 0);
                }
                
                const color = currentChartSensor.startsWith('box') 
                    ? sensorConfig[currentChartSensor].color 
                    : sensorConfig.init1.color;
                
                const label = currentChartSensor.startsWith('box')
                    ? `Box ${currentChartSensor.replace('box', '')}`
                    : 'Kondisi Awal';
                
                filtered.forEach(d => allLabels.add(d.timestamp));
                
                datasets.push({
                    label: label,
                    data: filtered.map(d => ({ x: d.timestamp, y: Math.round(d.value) })),
                    borderColor: color,
                    backgroundColor: color + '20',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 2
                });
            }
            
            // Sort labels and format
            const sortedLabels = Array.from(allLabels).sort((a, b) => a - b);
            const formattedLabels = sortedLabels.map(ts => {
                const date = new Date(ts);
                return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            });
            
            mainChart.data.labels = formattedLabels;
            mainChart.data.datasets = datasets;
            mainChart.update();
            
            const totalPoints = datasets.reduce((sum, ds) => sum + ds.data.length, 0);
            document.getElementById('chartInfo').textContent = `${totalPoints} data points in last ${currentTimeRange}h`;
        }
        
        function updateChartSensor() {
            currentChartSensor = document.getElementById('chartSensorSelect').value;
            updateMainChart();
        }
        
        function changeTimeRange(hours) {
            currentTimeRange = hours;
            
            // Update button styles
            document.querySelectorAll('.chart-selector .chart-btn').forEach(btn => {
                if (btn.tagName === 'BUTTON') {
                    btn.classList.remove('active');
                    if (btn.textContent === hours + 'h') {
                        btn.classList.add('active');
                    }
                }
            });
            
            updateMainChart();
        }
        
        // Initialize everything
        function init() {
            console.log('Initializing CO2 Dashboard...');
            console.log('Firebase paths:');
            console.log('- Tabung: tabungX/P1/latest, tabungX/P2/latest');
            console.log('- Box: boxX/latest');
            console.log('- Init: init1/latest');
            
            generateTabungCards();
            generateBoxCards();
            generateInitCards();
            generateStatusBadges();
            initMainChart();
            
            // Setup all sensors
            for (let i = 1; i <= 6; i++) {
                setupTabungSensor(i);
                setupBoxSensor(i);
            }
            setupInitSensor();
            
            // Initial chart update
            setTimeout(updateMainChart, 2000);
        }
        
        // Auto-refresh history every 5 minutes
        setInterval(() => {
            for (let i = 1; i <= 6; i++) {
                loadTabungHistory(i, 'P1');
                loadTabungHistory(i, 'P2');
                loadBoxHistory(i);
            }
            loadInitHistory();
        }, 5 * 60 * 1000);
        
        // Start
        init();
    </script>
</body>
</html>
